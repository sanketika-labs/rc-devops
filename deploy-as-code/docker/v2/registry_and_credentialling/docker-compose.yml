version: '2.4'

services:
  db:
    image: postgres:16
    volumes:
      - ./${DB_DIR-db-data}:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=registry
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KRATOS_DB_PASSWORD=${KRATOS_DB_PASSWORD}
      - HYDRA_DB_PASSWORD=${HYDRA_DB_PASSWORD}
      - KETO_DB_PASSWORD=${KETO_DB_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
  registry:
    image: ghcr.io/sunbird-rc/sunbird-rc-core:${RELEASE_VERSION}
    volumes:
      - ./${SCHEMA_DIR-java/registry/src/main/resources/public/_schemas}:/home/sunbirdrc/config/public/_schemas
      - ./${VIEW_DIR-java/registry/src/main/resources/views}:/home/sunbirdrc/config/views/
    environment:
      - connectionInfo_uri=jdbc:postgresql://db:5432/registry
      - connectionInfo_username=postgres
      - connectionInfo_password=${POSTGRES_PASSWORD}
      # Auth — validates JWTs via Hydra JWKS
      - oauth2_resource_uri=http://hydra:4444
      - oauth2_resource_roles_path=ext.role
      - oauth2_resource_email_path=ext.email
      - registry_system_base_roles=admin
      - encryption_enabled=${ENCRYPTION_ENABLED-false}
      - encryption_health_check_url=http://encryption-service:8013/health
      - encryption_uri=http://encryption-service:8013/crypto/v1/_encrypt
      - decryption_uri=http://encryption-service:8013/crypto/v1/_decrypt
      - encryption_batch_uri=http://encryption-service:8013/crypto/v1/_encrypt
      - decryption_batch_uri=http://encryption-service:8013/crypto/v1/_decrypt
      - event_enabled=${EVENT_ENABLED-false}
      - event_topic=events
      - event_providerName=dev.sunbirdrc.registry.service.impl.KafkaEventService
      - elastic_search_connection_url=${ELASTIC_SEARCH_CONNECTION_URL-es:9200}
      - elastic_search_scheme=${ELASTIC_SEARCH_SCHEME-http}
      - elastic_search_auth_enabled=${ELASTIC_SECURITY_ENABLED-false}
      - elastic_search_username=${ELASTIC_SEARCH_USERNAME-elastic}
      - elastic_search_password=${ELASTIC_SEARCH_PASSWORD}
      - search_providerName=${SEARCH_PROVIDER_NAME-dev.sunbirdrc.registry.service.NativeSearchService}
      - identity_provider=dev.sunbirdrc.auth.keycloak.KeycloakProviderImpl
      - idgen_enabled=${IDGEN_ENABLED-false}
      - idgen_health_check_url=http://id-gen-service:8088/egov-idgen/health
      - idgen_generate_url=http://id-gen-service:8088/egov-idgen/id/_generate
      - idgen_id_format_url=http://id-gen-service:8088/egov-idgen/id/_format/add
      - claims_enabled=${CLAIMS_ENABLED-false}
      - claims_url=http://claim-ms:8082
      - did_enabled=${DID_ENABLED-false}
      - did_health_check_url=http://identity:3332/health
      - did_generate_url=http://identity:3332/did/generate
      - did_resolve_url=http://identity:3332/did/resolve/{id}
      - signature_enabled=${SIGNATURE_ENABLED-false}
      - signature_provider=${SIGNATURE_PROVIDER-dev.sunbirdrc.registry.service.impl.SignatureV2ServiceImpl}
      - signature_v2_credential_did_method=rcw
      - signature_v2_issuer_did_method=issuer
      - signature_v2_schema_author=Registry
      - signature_v2_schema_author_did_method=author
      - signature_v2_health_check_url=http://credential:3000/health
      - signature_v2_issue_url=http://credential:3000/credentials/issue
      - signature_v2_get_url=http://credential:3000/credentials/{id}
      - signature_v2_delete_url=http://credential:3000/credentials/{id}
      - signature_v2_verify_url=http://credential:3000/credentials/{id}/verify
      - signature_v2_verify_any_url=http://credential:3000/credentials/verify
      - signature_v2_revocation_list_url=http://credential:3000/credentials/revocation-list?issuerId={issuerDid}&page={page}&limit={limit}
      - signature_v2_schema_health_check_url=http://credential-schema:3333/health
      - signature_v2_schema_create_url=http://credential-schema:3333/credential-schema
      - signature_v2_schema_update_url=http://credential-schema:3333/credential-schema/{id}/{version}
      - signature_v2_schema_get_by_id_and_version_url=http://credential-schema:3333/credential-schema/{id}/{version}
      - signature_v2_schema_search_by_tags_url=http://credential-schema:3333/credential-schema?tags={tags}
      - sign_url=http://certificate-signer:8079/sign
      - verify_url=http://certificate-signer:8079/verify
      - sign_health_check_url=http://certificate-signer:8079/health
      - certificate_enabled=${CERTIFICATE_ENABLED-false}
      - pdf_url=http://certificate-api:8078/api/v1/certificatePDF
      - certificate_health_check_url=http://certificate-api:8078/health
      - template_base_url=http://registry:8081/api/v1/templates/ #Looks for certificate templates for pdf copy of the signed certificate
      - filestorage_enabled=${FILESSTORAGE_ENABLED-false}
      - filestorage_connection_url=http://file-storage:9000
      - filestorage_access_key=${FILESTORAGE_ACCESS_KEY}
      - filestorage_secret_key=${FILESTORAGE_SECRET_KEY}
      - filestorage_bucket_key=issuance
      - registry_base_apis_enable=false
      - logging.level.root=INFO
      - enable_external_templates=true
      - async_enabled=${ASYNC_ENABLED-false}
      - authentication_enabled=${AUTHENTICATION_ENABLED-false}
      - kafka_bootstrap_address=kafka:9092
      - webhook_enabled=false
      - webhook_url=http://localhost:5001/api/v1/callback
      - redis_host=redis
      - redis_port=6379
      - manager_type=${MANAGER_TYPE-DefinitionsManager}
      - expand_reference=${EXPAND_REFERENCE-false}
      - swagger_title=${SWAGGER_TITLE-Sunbird Registry and Credential}
      - notification_async_enabled=${NOTIFICATION_ASYNC_ENABLED-false}
      - notification_enabled=${NOTIFICATION_ENABLED-false}
      - notification_url=${NOTIFICATION_URL-http://notification-ms:8765/notification-service/v1/notification}
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy
      hydra:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -nv -t1 --spider http://localhost:8081/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
  vault:
    image: vault:1.13.3
    restart: always
    volumes:
      - ./vault.json:/vault/config/vault.json
      - ./vault-data:/vault/file
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_API_ADDR=${VAULT_API_ADDR}
      - VAULT_ADDRESS=${VAULT_ADDRESS}
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/vault.json
    ports:
      - 8200:8200
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider http://127.0.0.1:8200/v1/sys/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  identity:
    image: ghcr.io/sunbird-rc/sunbird-rc-identity-service:${RELEASE_VERSION}
    ports:
      - "3332:3332"
    depends_on:
      vault:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/registry
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_BASE_URL=${VAULT_BASE_URL}
      - VAULT_ROOT_PATH=${VAULT_ROOT_PATH}
      - VAULT_TIMEOUT=${VAULT_TIMEOUT}
      - VAULT_PROXY=${VAULT_PROXY}
      - SIGNING_ALGORITHM=${SIGNING_ALGORITHM}
      - JWKS_URI=${JWKS_URI}
      - ENABLE_AUTH=${ENABLE_AUTH}
      - WEB_DID_BASE_URL=${WEB_DID_BASE_URL}
    healthcheck:
      test:
        [ "CMD-SHELL", "curl -f http://localhost:3332/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
  credential-schema:
    image: ghcr.io/sunbird-rc/sunbird-rc-credential-schema:${RELEASE_VERSION}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/registry
      - IDENTITY_BASE_URL=${IDENTITY_BASE_URL}
      - JWKS_URI=${JWKS_URI}
      - ENABLE_AUTH=${ENABLE_AUTH}
    healthcheck:
      test:
        [ "CMD-SHELL", "curl -f http://localhost:3333/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
  credential:
    image: ghcr.io/sunbird-rc/sunbird-rc-credentials-service:${RELEASE_VERSION}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/registry
      - IDENTITY_BASE_URL=${IDENTITY_BASE_URL}
      - SCHEMA_BASE_URL=${SCHEMA_BASE_URL}
      - CREDENTIAL_SERVICE_BASE_URL=${CREDENTIAL_SERVICE_BASE_URL}
      - JWKS_URI=${JWKS_URI}
      - ENABLE_AUTH=${ENABLE_AUTH}
      - QR_TYPE=${QR_TYPE}
    healthcheck:
      test:
        [ "CMD-SHELL", "curl -f http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ── Kratos ───────────────────────────────────────────────────────────────────
  kratos-migrate:
    image: oryd/kratos:v1.0.0
    environment:
      - DSN=postgres://kratos:${KRATOS_DB_PASSWORD}@db:5432/kratos?sslmode=disable
    volumes:
      - ./ory/kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.0.0
    depends_on:
      kratos-migrate:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:${KRATOS_DB_PASSWORD}@db:5432/kratos?sslmode=disable
      - LOG_LEVEL=info
      - SERVE_PUBLIC_BASE_URL=${RC_ADMIN_BASE_URL}/kratos/
      - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL=${RC_ADMIN_BASE_URL}/
      - SELFSERVICE_FLOWS_ERROR_UI_URL=${RC_ADMIN_BASE_URL}/error
      - SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL=${RC_ADMIN_BASE_URL}/login
      - SELFSERVICE_FLOWS_LOGIN_UI_URL=${EXT_OIDC_BASE_URL}/ui/login
      - SELFSERVICE_FLOWS_REGISTRATION_UI_URL=${EXT_OIDC_BASE_URL}/ui/registration
    volumes:
      - ./ory/kratos:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    ports:
      - '4433:4433'
      - '4434:4434'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4433/health/alive']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  # ── Hydra ────────────────────────────────────────────────────────────────────
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    environment:
      - DSN=postgres://hydra:${HYDRA_DB_PASSWORD}@db:5432/hydra?sslmode=disable
    command: migrate sql -e --yes
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v2.2.0
    depends_on:
      hydra-migrate:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - DSN=postgres://hydra:${HYDRA_DB_PASSWORD}@db:5432/hydra?sslmode=disable
      - LOG_LEVEL=info
      - SECRETS_SYSTEM=${HYDRA_SYSTEM_SECRET}
      - SECRETS_COOKIE=${HYDRA_COOKIE_SECRET}
      - OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT=${HYDRA_PAIRWISE_SALT}
    volumes:
      - ./ory/hydra:/etc/config/hydra
    command: serve all --config /etc/config/hydra/hydra.yml --dev
    ports:
      - '4444:4444'
      - '4445:4445'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4444/health/alive']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Hydra Client Bootstrap ───────────────────────────────────────────────────
  hydra-client-init:
    image: curlimages/curl:latest
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      - RC_CLIENT_SECRET=${RC_CLIENT_SECRET}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        echo "==> Registering rc-client OAuth2 client..."
        CLIENT_JSON="{
          \"client_id\":   \"rc-client\",
          \"client_name\": \"Sunbird RC Admin\",
          \"client_secret\": \"${RC_CLIENT_SECRET}\",
          \"grant_types\":  [\"authorization_code\", \"refresh_token\", \"client_credentials\"],
          \"response_types\": [\"code\"],
          \"scope\": \"openid offline_access email profile\",
          \"redirect_uris\": [\"http://localhost:3000/callback\", \"http://localhost:3000/\"],
          \"post_logout_redirect_uris\": [\"http://localhost:3000/login\", \"http://localhost:3000/\"],
          \"token_endpoint_auth_method\": \"client_secret_post\",
          \"subject_type\": \"public\"
        }"
        STATUS=$$(curl -s -o /tmp/resp.json -w "%{http_code}" \
          -X POST http://hydra:4445/admin/clients \
          -H "Content-Type: application/json" \
          -d "$$CLIENT_JSON")
        case "$$STATUS" in
          201) echo "==> Client registered." ;;
          409)
            echo "==> Client already exists — updating..."
            STATUS=$$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X PUT http://hydra:4445/admin/clients/rc-client \
              -H "Content-Type: application/json" \
              -d "$$CLIENT_JSON")
            [ "$$STATUS" = "200" ] && echo "==> Client updated." || { echo "==> Update FAILED (HTTP $$STATUS):"; cat /tmp/resp.json; exit 1; }
            ;;
          *) echo "==> FAILED (HTTP $$STATUS):"; cat /tmp/resp.json; exit 1 ;;
        esac
    restart: on-failure

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./imports/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      registry:
        condition: service_healthy
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'localhost:80']
      interval: 30s
      timeout: 10s
      retries: 10
  rc-admin:
    image: sanketikahub/rc-admin:v0.8
    ports:
      - '4000:8080'
    depends_on:
      registry:
        condition: service_healthy
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080

      # ── Frontend config (served via GET /config, read by browser at startup) ──
      VITE_API_BASE_URL: ${RC_ADMIN_BASE_URL}
      VITE_OAUTH2_CLIENT_ID: rc-client
      VITE_OAUTH2_REDIRECT_URI: ${RC_ADMIN_BASE_URL}/callback
      VITE_ORY_HYDRA_PUBLIC: ${RC_ADMIN_BASE_URL}/hydra
      VITE_ORY_KRATOS_PUBLIC: ${RC_ADMIN_BASE_URL}/kratos
      VITE_ISSUER_DID: ${ISSUER_DID-}
      VITE_SCHEMA_ID: ${SCHEMA_ID-}
      VITE_SCHEMA_VERSION: ${SCHEMA_VERSION-}
      VITE_TEMPLATE_ID: ${TEMPLATE_ID-}

      # ── Proxy targets (internal Docker network — not visible to browser) ──────
      ORY_HYDRA_PUBLIC_URL: http://hydra:4444
      ORY_HYDRA_ADMIN_URL: http://hydra:4445
      ORY_KRATOS_PUBLIC_URL: http://kratos:4433
      API_BASE_URL: http://registry:8081
      CREDENTIAL_SERVICE_URL: http://credential:3000
      EXT_OIDC_BASE_URL: ${EXT_OIDC_BASE_URL}

      # ── Secrets (server-side only, never sent to browser) ────────────────────
      OAUTH2_CLIENT_SECRET: ${RC_CLIENT_SECRET}
      EXT_OIDC_CLIENT_SECRET: ${EXT_OIDC_CLIENT_SECRET}
      EXT_OIDC_CLIENT_ID: ${EXT_OIDC_CLIENT_ID}
      EXT_OIDC_REDIRECT_URI: ${RC_ADMIN_BASE_URL}/callback
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DB_URL=postgres://hydra:${HYDRA_DB_PASSWORD}@db:5432/hydra
